{% extends "stitchViz/base.html" %}
{% load static %}

{% block title %}Login | StitchViz{% endblock %}

{% block content %}
<div class="flex flex-col items-center mb-6">
    <img src="{% static 'Logo-stitchViz.jpg' %}" alt="StitchViz Logo" class="h-16 w-16 rounded mb-2" />
</div>
<h2 class="text-xl font-semibold mb-6 text-center">Login</h2>
{% if messages %}
    {% for message in messages %}
        <div class="mb-4 p-3 rounded {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
<form method="post" action="{% url 'login' %}" class="space-y-4">
    {% csrf_token %}
    <div>
        <label class="block mb-1 font-medium" for="email">Email</label>
        <input id="email" name="email" type="text" required
               class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <div>
        <label class="block mb-1 font-medium" for="password">Password</label>
        <input id="password" name="password" type="password" required
               class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <button type="submit" class="w-full py-2 bg-black text-white rounded hover:bg-grey">Login</button>
</form>
<p class="mt-4 text-center">
    Don't have an account? <a href="{% url 'signup' %}" class="text-black hover:underline">Sign up here</a>.
</p>
{% endblock %}
